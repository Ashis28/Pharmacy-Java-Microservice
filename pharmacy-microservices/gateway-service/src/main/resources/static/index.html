<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharmacy API - Swagger UI</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
    h1 { color: #2c3e50; margin-bottom: 8px; }
    p { color: #7f8c8d; margin-bottom: 30px; }
    .btn { display: block; margin: 10px auto; padding: 12px 24px; background: #3498db; color: white; text-decoration: none; border-radius: 6px; font-size: 15px; transition: background 0.2s; }
    .btn:hover { background: #2980b9; }
    .btn.green { background: #27ae60; } .btn.green:hover { background: #219a52; }
    .btn.orange { background: #e67e22; } .btn.orange:hover { background: #d35400; }
    .btn.purple { background: #8e44ad; } .btn.purple:hover { background: #7d3c98; }
    .btn.red { background: #e74c3c; } .btn.red:hover { background: #c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏥 Pharmacy Microservices</h1>
    <p>Select a service to open its Swagger UI</p>
    <a class="btn" href="http://localhost:9091/swagger-ui/index.html" target="_blank">Auth Service (9091)</a>
    <a class="btn green" href="http://localhost:9092/swagger-ui/index.html" target="_blank">Catalog Service (9092)</a>
    <a class="btn orange" href="http://localhost:9093/swagger-ui/index.html" target="_blank">Order Service (9093)</a>
    <a class="btn purple" href="http://localhost:9094/swagger-ui/index.html" target="_blank">Admin Service (9094)</a>
    <a class="btn red" href="http://localhost:9095/swagger-ui/index.html" target="_blank">Payment Service (9095)</a>
  </div>
</body>
</html>
